    <section id="register" class="registration-section">
        <h2 class="section-title">  Registration</h2>
        <form class="reg-form">
            <div class="form-group">
                <label for="fullname" class="form-label">Full Name</label>
                <input type="text" id="fullname" name="fullname" class="form-input" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="Enter your email" required>
            </div>
            <button type="submit" class="form-submit">Complete Registration</button>
        </form>
    </section>
